name: kraiiv
description: A warm, supportive mobile nutrition habit companion app for Nigerians.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.0.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  go_router: ^13.2.0
  google_sign_in: ^6.2.1
  firebase_auth: ^4.17.4
  firebase_core: ^2.25.4
  flutter_svg: ^2.0.9
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
