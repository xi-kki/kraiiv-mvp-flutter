name: kraiiv
description: A warm, supportive mobile nutrition habit companion app for Nigerians.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.0.0
  camera: ^0.10.6
  image_picker: ^1.0.7
  go_router: ^13.2.0
  timezone: ^0.9.4
  http: ^1.2.0
  flutter_svg: ^2.0.9
  http_parser: ^4.0.2
  intl: ^0.19.0
  lucide_flutter: ^1.20.0
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
