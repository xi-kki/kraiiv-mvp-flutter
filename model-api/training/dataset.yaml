# Nigerian Foods — YOLO Dataset Config
# YOLOv8 / YOLOv11 training manifest for future bounding-box fine-tune.
# Currently the Kraiiv stack uses EfficientNetV2-S (classification, not detection)
# — this file prepares the ground for a YOLO detector when bbox-annotated data exists.
#
# Place images under datasets/nigerian-foods/{images,labels}/{train,val}
# and run: yolo detect train data=dataset.yaml model=yolov8n.pt epochs=30

path: ./datasets/nigerian-foods   # dataset root (relative to this file)
train: images/train
val: images/val
test: images/test                 # optional held-out split

# 41 classes — aligned 1:1 with yusasif/Nigerian-food-recognision label_vocab.json
# (revision 36a13b5de1ecc61162f7d1ee21e28b11420cdb29).  Kraiiv nigerian_foods.json
# (46 nutrition entries) maps onto these via ALIASES in model-api/main.py.
